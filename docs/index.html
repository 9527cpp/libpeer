<!doctype html>
<html lang="en">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/mqtt@4.1.0/dist/mqtt.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.2/dist/zephyr/bootstrap.min.css">
  <title>libpeer test</title>
<style>
.stats-overlay {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 4px 8px;
  background: rgba(0, 0, 0, 0.6);
  color: #fff;
  font: 12px/1.4 monospace;
  text-align: left;
  white-space: pre;
  border-radius: 4px;
  pointer-events: none;
}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-light" data-bs-theme="light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">libpeer test</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor03" aria-controls="navbarColor03" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarColor03">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="https://github.com/sepfy/libpeer">Github</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="https://ko-fi.com/sepfy95">Sponsor</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
  <div class="container mt-4">
    <div class="mb-4">
      <div class="row mb-2">
        <div class="col-1">
          <p class="h5 mb-0">URL:</p>
        </div>
        <div class="col-6">
          <p class="h5 mb-0" id="device-url"></p>
        </div>
        <div class="col-5 d-flex flex-wrap align-items-center justify-content-end gap-3">
	  <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="camera-switch">
            <label class="form-check-label" for="switch1">Camera</label>
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="microphone-switch">
            <label class="form-check-label" for="switch2">Microphone</label>
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="stats-switch" checked>
            <label class="form-check-label" for="stats-switch">Stats</label>
        </div>
          <button class="btn btn-outline-dark" id="connect">Connect</button>
        </div>
      </div>
      <div class="row mb-2">
        <div class="col-1">
          <p class="h5 mb-0">Status:</p>
        </div>
        <div class="col-11">
          <p class="h5 mb-0" id="status">Disconnected</p>
        </div>
      </div>
    </div>
    <div class="row g-4">
      <div class="col-md-6">
        <div class="p-3 border bg-light text-center">
          <h5>Video</h5>
          <div class="position-relative">
            <video controls id="video-stream" class="w-100" style="max-height: 400px; display: none">
              <p>Your browser does not support the video element.</p>
            </video>
            <img id="img-stream" class="w-100">
            <div id="stats-overlay" class="stats-overlay" hidden></div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="p-3 border bg-light text-center mb-3">
          <h5>Audio</h5>
          <audio controls id="audio-stream" class="w-100">
            <p>Your browser does not support the audio element.</p>
          </audio>
        </div>

        <div class="p-3 border bg-light text-center">
          <h5>DataChannel</h5>
            <textarea id="datachannel-input" class="form-control" rows="12"></textarea>
        </div>
      </div>
    </div>
  </div>

<script>

// URL parameters:
//   id      device id, the device runs with -u mqtts://<broker host>/public/<id>
//   broker  MQTT over WebSocket URL, default wss://broker.emqx.io:8084/mqtt
//   ice     stun:<host>:<port> or turn:<host>:<port>,<username>,<credential>, can be repeated,
//           "none" for host candidates only, default stun:stun.l.google.com:19302
//   relay   only use TURN relayed candidates
//   legacy  for devices built before sessions were supported
const queryString = window.location.search
const urlParams = new URLSearchParams(queryString)
const deviceId = urlParams.get("id")
const brokerUrl = urlParams.get("broker") || "wss://broker.emqx.io:8084/mqtt"
// every page talks on its own session topics so that the device can serve several browsers
const sessionId = urlParams.has("legacy") ? "" : "/" + Math.random().toString(36).slice(2, 10)
const resultTopic = "/public/" + deviceId + sessionId + "/result"
const invokeTopic = "/public/" + deviceId + sessionId + "/invoke"
const client  = mqtt.connect(brokerUrl)

function parseIceServer(value) {
  const [urls, username, credential] = value.split(",")
  return username === undefined ? { urls } : { urls, username, credential }
}

function getIceServers() {
  if (!urlParams.has("ice")) {
    return [{ urls: "stun:stun.l.google.com:19302" }]
  }
  return urlParams.getAll("ice").filter(v => v && v !== "none").map(parseIceServer)
}

function getRandomItem(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function generateRadomId() {
  const appearance = ["fluffy", "spotted", "striped", "sleek", "furry", "shiny"];
  const personality = ["brave", "calm", "happy", "kind", "lazy", "smart"];
  const animals = ["lion", "tiger", "panda", "fox", "rabbit", "eagle"];

  const randomAppearance = getRandomItem(appearance);
  const randomPersonality = getRandomItem(personality);
  const randomAnimal = getRandomItem(animals);
  return `${randomAppearance}-${randomPersonality}-${randomAnimal}`;
}

window.onload = function() {

  if (deviceId == undefined) {
    urlParams.set("id", generateRadomId())
    window.location.search = urlParams.toString()
    return
  }

  document.getElementById("device-url").textContent = "mqtts://" + new URL(brokerUrl).hostname + "/public/" + deviceId;
  const canvas = document.createElement('canvas')
  canvas.width = 640
  canvas.height = 480
  
  const ctx = canvas.getContext('2d')
  ctx.fillStyle = 'rgba(200, 200, 200, 100)'
  ctx.fillRect(0, 0, 640, 480)

  const img = new Image(640, 480)
  img.src = canvas.toDataURL()

  document.getElementById('img-stream').src = img.src;
}

var offerId = Math.floor((Math.random() * 1000) + 1);
var answerId = Math.floor((Math.random() * 1000) + 1);
var closeId = Math.floor((Math.random() * 1000) + 1);

var pc = new RTCPeerConnection({
  iceServers: getIceServers(),
  iceTransportPolicy: urlParams.has("relay") ? "relay" : "all",
});

const datachannel = pc.createDataChannel("libpeer")

pc.ontrack = (e) => {

  if (e.track.kind == "video") {

    var el = document.getElementById('video-stream');
    var newStream = new MediaStream();
    newStream.addTrack(e.track);
    el.srcObject = newStream;
    el.autoplay = true
    el.controls = false
    el.muted = true
    document.getElementById("img-stream").style.display = "none";
    document.getElementById("video-stream").style.display = "block";

  } else if (e.track.kind == "audio") {

    var el = document.getElementById("audio-stream");
    var newStream = new MediaStream();
    newStream.addTrack(e.track);
    el.srcObject = newStream;
    el.autoplay = true
    el.controls = true
    el.muted = true
  }
}

pc.oniceconnectionstatechange = (e) => {

  document.getElementById("status").innerHTML = pc.iceConnectionState;
}

pc.ondatachannel = () => {
  console.log('ondatachannel');
}

datachannel.onclose = () => {
  console.log('datachannel has closed');
}

function updateTextarea(text) {
  const currentTime = new Date().toLocaleTimeString(); 
  const timestamp = `[${currentTime}] `;
  const textarea = document.getElementById("datachannel-input");
  textarea.value += (textarea.value ? "\n" : "") + timestamp + text;
  textarea.scrollTop = textarea.scrollHeight;
}

datachannel.onopen = () => {
  console.log('datachannel has opened');
  console.log('sending ping');
  setInterval(() => {
    console.log('sending ping');
    updateTextarea("ping");
    datachannel.send("ping");
  }, 1000);
}

datachannel.onmessage = (e) => {

  if (e.data.byteLength === undefined) {

    console.log(e.data);
    updateTextarea("<<<" + e.data);
  } else {

    // is binary data. mjpeg stream
    //console.log(e.data.byteLength);
    var arrayBufferView = new Uint8Array(e.data);
    var blob = new Blob( [ arrayBufferView ], { type: "image/jpeg" } );
    var urlCreator = window.URL || window.webkitURL;
    var imageUrl = urlCreator.createObjectURL( blob );
  
    var imageElement = document.getElementById('img-stream');
    imageElement.src = imageUrl;
  }  
}

// Interfaces without internet access (VPN, virtual NICs) keep ICE gathering busy until
// their STUN requests time out (~40s), so do not wait for "complete" longer than this.
// Only used when the device does not support trickle ICE.
const ICE_GATHERING_TIMEOUT_MS = 2000
let answerSent = false
let gatheringTimer = null
let trickle = false
let pendingLocalCandidates = []

function sendCandidate(candidate) {
  console.log(`send candidate ${candidate}`)
  client.publish(invokeTopic, JSON.stringify({
    jsonrpc: "2.0",
    method: "candidate",
    params: candidate,
  }))
}

function sendAnswer(reason) {
  if (answerSent || !pc.localDescription) {
    return
  }
  answerSent = true
  clearTimeout(gatheringTimer)
  console.log(`send answer (${reason})`)
  console.log(pc.localDescription.sdp)
  client.publish(invokeTopic, JSON.stringify({
    jsonrpc: "2.0",
    method: "answer",
    params: pc.localDescription.sdp,
    id: answerId,
  }))
  pendingLocalCandidates.forEach(sendCandidate)
  pendingLocalCandidates = []
}

pc.onicecandidate = (e) => {
  // libpeer only supports UDP candidates
  if (!trickle || !e.candidate || !e.candidate.candidate || e.candidate.protocol !== "udp") {
    return
  }
  if (answerSent) {
    sendCandidate(e.candidate.candidate)
  } else {
    pendingLocalCandidates.push(e.candidate.candidate)
  }
}

pc.onicegatheringstatechange = () => {

  if (pc.iceGatheringState === "complete") {
    sendAnswer("gathering complete")
  }
};

client.on('connect', () => {
  console.log("connected")
  client.subscribe(resultTopic, (err) => { })
  sendPendingClose()
})

document.getElementById("connect").addEventListener("click", async () => {

  const cameraSwitch = document.getElementById("camera-switch");
  const microphoneSwitch = document.getElementById("microphone-switch");
  const constraints = {
    video: cameraSwitch.checked,
    audio: microphoneSwitch.checked,
  }

  if (constraints.video || constraints.audio) {
    await navigator.mediaDevices.getUserMedia(constraints).then(stream => {
      stream.getTracks().forEach(track => { console.log(track); pc.addTrack(track, stream)});
    }).catch((e) => {
      alert(e)
    });
  }

  client.publish(invokeTopic, JSON.stringify({
    jsonrpc: "2.0",
    method: "offer",
    id: offerId,
  }))
})

// Only devices with a datachannel notice that the page is gone (SCTP abort), the others
// wait for their idle timeout, so tell the device to release the connection.
// The publish is often lost when the page is reloaded, so the next page loaded in this
// tab repeats it.
const PENDING_CLOSE_KEY = "libpeer-pending-close"

function sendClose(topic) {
  client.publish(topic, JSON.stringify({
    jsonrpc: "2.0",
    method: "close",
    id: closeId,
  }))
}

window.addEventListener("pagehide", () => {
  if (pc.connectionState === "new" || pc.connectionState === "closed") {
    return
  }
  sessionStorage.setItem(PENDING_CLOSE_KEY, JSON.stringify({ deviceId, invokeTopic }))
  sendClose(invokeTopic)
})

function sendPendingClose() {
  const pending = JSON.parse(sessionStorage.getItem(PENDING_CLOSE_KEY) || "null")
  sessionStorage.removeItem(PENDING_CLOSE_KEY)
  if (pending && pending.deviceId === deviceId) {
    console.log(`close the previous session ${pending.invokeTopic}`)
    sendClose(pending.invokeTopic)
  }
}

const STATS_INTERVAL_MS = 1000
let lastStats = null

function fmtBitrate(bps) {
  if (bps === undefined) return "-"
  return bps >= 1e6 ? `${(bps / 1e6).toFixed(2)} Mbps` : `${Math.round(bps / 1e3)} kbps`
}

function fmtMs(seconds) {
  return seconds === undefined ? "-" : `${(seconds * 1000).toFixed(1)} ms`
}

function fmtPercent(ratio) {
  return ratio === undefined ? "-" : `${(ratio * 100).toFixed(1)}%`
}

function fmtCount(value) {
  return value === undefined ? "-" : value
}

function delta(s, field) {
  const prev = lastStats && lastStats.get(s.id)
  if (!prev || s[field] === undefined || prev[field] === undefined) return undefined
  return s[field] - prev[field]
}

function perSecond(s, field) {
  const d = delta(s, field)
  if (d === undefined) return undefined
  const dt = (s.timestamp - lastStats.get(s.id).timestamp) / 1000
  return dt > 0 ? d / dt : undefined
}

function bitrate(s, bytesField) {
  const value = perSecond(s, bytesField)
  return fmtBitrate(value === undefined ? undefined : value * 8)
}

function fps(s, framesField) {
  const value = s.framesPerSecond !== undefined ? s.framesPerSecond : perSecond(s, framesField)
  return value === undefined ? "- fps" : `${Math.round(value)} fps`
}

function videoInfo(report, s) {
  const codec = s.codecId && report.get(s.codecId)
  const name = codec ? codec.mimeType.split("/")[1] : "-"
  const size = s.frameWidth ? `${s.frameWidth}x${s.frameHeight}` : "-"
  return `${name} ${size}`
}

function inboundLines(report, s) {
  const lost = delta(s, "packetsLost")
  const received = delta(s, "packetsReceived")
  let loss
  if (lost !== undefined && received !== undefined && lost + received > 0) {
    loss = Math.max(lost, 0) / (Math.max(lost, 0) + received)
  }
  const emitted = delta(s, "jitterBufferEmittedCount")
  const bufferDelay = emitted > 0 ? delta(s, "jitterBufferDelay") / emitted : undefined
  return [
    `recv  ${videoInfo(report, s)}  ${fps(s, "framesDecoded")}  ${bitrate(s, "bytesReceived")}`,
    `      jitter ${fmtMs(s.jitter)}  buffer ${fmtMs(bufferDelay)}  loss ${fmtPercent(loss)} (total ${fmtCount(s.packetsLost)})`,
    `      nack ${fmtCount(s.nackCount)}  pli ${fmtCount(s.pliCount)}  dropped ${fmtCount(s.framesDropped)}  freezes ${fmtCount(s.freezeCount)}`,
  ]
}

function outboundLines(report, s) {
  let remote
  report.forEach(r => {
    if (r.type === "remote-inbound-rtp" && r.localId === s.id) remote = r
  })
  const lines = [
    `send  ${videoInfo(report, s)}  ${fps(s, "framesEncoded")}  ${bitrate(s, "bytesSent")}` +
      (s.targetBitrate ? `  target ${fmtBitrate(s.targetBitrate)}` : ""),
    `      nack ${fmtCount(s.nackCount)}  pli ${fmtCount(s.pliCount)}  limit ${s.qualityLimitationReason || "-"}`,
  ]
  // filled from the receiver reports sent back by the device
  if (remote) {
    lines.push(`      remote rtt ${fmtMs(remote.roundTripTime)}  jitter ${fmtMs(remote.jitter)}  loss ${fmtPercent(remote.fractionLost)}`)
  }
  return lines
}

function linkLine(report) {
  let pair
  report.forEach(s => {
    if (s.type === "transport" && s.selectedCandidatePairId) pair = report.get(s.selectedCandidatePairId)
  })
  if (!pair) {
    report.forEach(s => {
      if (s.type === "candidate-pair" && (s.selected || (s.nominated && s.state === "succeeded"))) pair = s
    })
  }
  if (!pair) return null
  const local = report.get(pair.localCandidateId)
  const remote = report.get(pair.remoteCandidateId)
  const route = local && remote ? `  ${local.candidateType} -> ${remote.candidateType}` : ""
  return `link  rtt ${fmtMs(pair.currentRoundTripTime)}  bwe ${fmtBitrate(pair.availableOutgoingBitrate)}${route}`
}

async function updateStats() {
  const overlay = document.getElementById("stats-overlay")
  if (!document.getElementById("stats-switch").checked || pc.connectionState !== "connected") {
    overlay.hidden = true
    lastStats = null
    return
  }
  const report = await pc.getStats()
  const lines = []
  report.forEach(s => {
    if (s.kind !== "video") return
    if (s.type === "inbound-rtp") lines.push(...inboundLines(report, s))
    else if (s.type === "outbound-rtp") lines.push(...outboundLines(report, s))
  })
  const link = linkLine(report)
  if (link) lines.push(link)
  lastStats = report
  overlay.textContent = lines.join("\n")
  overlay.hidden = lines.length === 0
}

setInterval(() => updateStats().catch(e => console.error("get stats failed", e)), STATS_INTERVAL_MS)

client.on("message", (topic, message) => {

  let msg = JSON.parse(message.toString())
  if (msg.method === "candidate") {
    console.log(`receive candidate ${msg.params}`)
    if (msg.params) {
      // libpeer bundles everything on one transport, so the first m-line is enough
      pc.addIceCandidate({candidate: msg.params, sdpMLineIndex: 0})
        .catch(e => console.error("add remote candidate failed", e));
    }
    return
  }
  if (msg.id == offerId && msg.error) {
    console.error("offer request failed", msg.error)
    document.getElementById("status").innerHTML = msg.error.message
    return
  }
  if (msg.id == offerId) {
    console.log(msg.result)
    answerSent = false
    pendingLocalCandidates = []
    trickle = /^a=ice-options:.*\btrickle\b/m.test(msg.result)
    pc.setRemoteDescription({type: "offer", sdp: msg.result})
      .then(() => pc.createAnswer())
      .then(d => pc.setLocalDescription(d))
      .then(() => {
        if (trickle) {
          sendAnswer("trickle ice")
        } else if (pc.iceGatheringState === "complete") {
          sendAnswer("gathering complete")
        } else {
          gatheringTimer = setTimeout(() => sendAnswer("gathering timeout"), ICE_GATHERING_TIMEOUT_MS)
        }
      })
      .catch(e => console.error("handle offer failed", e));
  } 
})
</script>

</body>
</html>
