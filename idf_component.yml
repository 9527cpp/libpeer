dependencies:
  sepfy/srtp: ^2.0.4
  # Only for HAVE_USRSCTP builds, it does not compile with the GCC of ESP-IDF 6
  sepfy/usrsctp:
    version: ^0.9.5
    rules:
      - if: "idf_version <6.0"
  # cJSON left ESP-IDF (the json component) in v6.0
  espressif/cjson:
    version: ^1.7.19
    rules:
      - if: "idf_version >=6.0"
description: libpeer
license: MIT
url: https://github.com/sepfy/libpeer
version: 0.0.3
